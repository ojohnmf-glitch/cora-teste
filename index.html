<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0a12">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icone.png">
<style>body{margin:0}[hidden]:not([hidden=until-found i]){display:none!important}</style>
</head>
<body>
<title>Cora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Comfortaa:wght@600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400;1,7..72,600&display=swap">
<style>
/* Layout: one-screen app. Face + conversation on top, bottom tab bar on phones; on wide screens face column left, panels right. Large type for older eyes. */
:root{
  --bg:#FBF5F2; --surface:#FFFFFF; --surface-2:#F4E8E3; --line:#EAD8D0;
  --fg:#2A1D1A; --muted:#6E5A54;
  --accent:#C24E3B; --accent-fg:#FFFFFF; --accent-soft:#FBE1D9;
  --sun:#D9A62E; --sun-soft:#F6E9C4;
  --good:#2F7D4F; --warn:#9A6514; --crit:#B3261E; --info:#2F5F8A;
  --good-soft:#DCEFE2; --warn-soft:#F7E8CF; --crit-soft:#F8DCD9; --info-soft:#DCE8F3;
  --coral-a:#E05A47; --coral-b:#EE7B5E; --coral-c:#F29A7A;
  --skin:#C98E66; --skin-shade:#B07651; --hair:#2B1D17; --lip:#7E3B36; --blush:#E07A6A; --eye:#2A1C16;
  --f-display:"Literata", Georgia, "Times New Roman", serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --r:14px; --r-lg:22px;
  --t-xs:.82rem; --t-s:.92rem; --t-m:1.06rem; --t-l:1.3rem; --t-xl:1.75rem;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171110; --surface:#211816; --surface-2:#2C211E; --line:#3D2D29;
  --fg:#F4E9E5; --muted:#B59F98;
  --accent:#FF9A86; --accent-fg:#2A0F0A; --accent-soft:#3E2520;
  --sun:#E8C15A; --sun-soft:#3A321C;
  --coral-a:#FF8F7E; --coral-b:#FFAA8C; --coral-c:#FFC3A6;
  --good:#71C493; --warn:#E3AA52; --crit:#F08A80; --info:#8FB9E2;
  --good-soft:#1F3428; --warn-soft:#3A2E1A; --crit-soft:#3D2220; --info-soft:#1E2D3B;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171110; --surface:#211816; --surface-2:#2C211E; --line:#3D2D29;
  --fg:#F4E9E5; --muted:#B59F98;
  --accent:#FF9A86; --accent-fg:#2A0F0A; --accent-soft:#3E2520;
  --sun:#E8C15A; --sun-soft:#3A321C;
  --coral-a:#FF8F7E; --coral-b:#FFAA8C; --coral-c:#FFC3A6;
  --good:#71C493; --warn:#E3AA52; --crit:#F08A80; --info:#8FB9E2;
  --good-soft:#1F3428; --warn-soft:#3A2E1A; --crit-soft:#3D2220; --info-soft:#1E2D3B;
  color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;text-wrap:balance;margin:0;line-height:1.2}
p{margin:0}

.app{height:100%;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px 8px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font-size:var(--t-l);font-style:italic}
.brand small{color:var(--muted);font-size:var(--t-xs);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.clock{color:var(--muted);font-size:var(--t-s);font-variant-numeric:tabular-nums;text-align:right}

main{flex:1;min-height:0;overflow:hidden}
.view:not(.call) > *{max-width:760px;margin-left:auto;margin-right:auto}
.backbtn{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:8px 16px;min-height:44px;font-weight:700;cursor:pointer;color:var(--accent);border-color:var(--accent)}
.backbtn svg{width:20px;height:20px}
.wordmark{font-family:"Comfortaa","Atkinson Hyperlegible",system-ui,sans-serif;font-weight:700;letter-spacing:-.02em;line-height:1}
.wordmark.coral{background:linear-gradient(100deg,var(--coral-a),var(--coral-b) 55%,var(--coral-c));-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:.08em}
.topbar .wordmark{font-size:1.95rem}
body.in-call .topbar{display:none}
body.in-call{background:#0c0a12}
.view{height:100%;overflow:auto;padding:4px 16px 24px}
.view[hidden]{display:none!important}

/* Conversation view */
#v-conversa{display:grid;grid-template-rows:auto 1fr auto;gap:10px;overflow:hidden;padding-bottom:10px}
.stage{display:flex;align-items:center;gap:16px;padding:4px 0}
.face{width:124px;height:124px;flex:none;border-radius:50%;position:relative}
.face .ph{position:absolute;inset:0;border-radius:50%;overflow:hidden;background:var(--accent-soft)}
.face .ph img{width:100%;height:100%;max-width:none;object-fit:cover;object-position:50% 22%;display:block;transform-origin:50% 40%}
.face.photo::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:3px solid var(--accent-soft);pointer-events:none;transition:border-color .3s}
.face.photo.talking::after{border-color:var(--accent);animation:ring 1.3s ease-in-out infinite}
.face.photo.thinking::after{border-color:var(--sun);border-style:dashed;animation:spin 8s linear infinite}
.face.photo .ph img{animation:breathe2 6s ease-in-out infinite}
.face.photo.talking .ph img{animation:talk2 2.4s ease-in-out infinite}
@keyframes ring{50%{transform:scale(1.045);opacity:.55}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe2{50%{transform:scale(1.012)}}
@keyframes talk2{25%{transform:scale(1.012) rotate(-.4deg)}75%{transform:scale(1.02) rotate(.4deg)}}
.face svg{width:100%;height:100%;display:block}
.stage-text{min-width:0;display:flex;flex-direction:column;gap:4px}
#v-conversa.presence .stage{flex-direction:column;justify-content:center;gap:12px;padding-top:6px}
#v-conversa.presence .face{width:min(68vw,38vh,340px);height:min(68vw,38vh,340px)}
#v-conversa.presence .stage-text{align-items:center;text-align:center}
#v-conversa.presence .log{max-width:640px;width:100%;margin:0 auto}
#v-conversa.presence .msg.a .b{font-size:var(--t-l);line-height:1.45}
.modebtn{background:none;border:0;color:var(--accent);cursor:pointer;font-size:var(--t-s);font-weight:700;padding:4px 0;text-decoration:underline;text-underline-offset:3px;align-self:flex-start}
#v-conversa.presence .modebtn{align-self:center}
.stage-text .who{font-family:var(--f-display);font-size:var(--t-xl);font-style:italic;line-height:1.1}
.status{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:var(--t-s)}
.status i{width:9px;height:9px;border-radius:50%;background:var(--good);display:inline-block}
.status.thinking i{background:var(--sun);animation:pulse 1s infinite}
.status.talking i{background:#FF9A86;animation:pulse .6s infinite}
@keyframes pulse{50%{opacity:.3}}

.log{overflow:auto;display:flex;flex-direction:column;gap:12px;padding:6px 2px 8px;min-height:0;scroll-behavior:smooth}
.msg{max-width:min(88%,620px);display:flex;flex-direction:column;gap:6px}
.msg .b{padding:12px 16px;border-radius:var(--r-lg);white-space:pre-wrap;overflow-wrap:anywhere}
.msg.a{align-self:flex-start}
.msg.a .b{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px;font-family:var(--f-display);font-size:var(--t-m)}
.msg.u{align-self:flex-end}
.msg.u .b{background:var(--accent-soft);border-bottom-right-radius:6px}
.msg .meta{font-size:var(--t-xs);color:var(--muted);padding:0 8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.msg.u .meta{justify-content:flex-end}
.tag{font-size:var(--t-xs);padding:1px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);letter-spacing:.02em}
.tag.study{background:var(--sun-soft);color:var(--fg)}
.msg .acts{display:flex;gap:8px;flex-wrap:wrap;padding-left:4px}
.notice{align-self:center;font-size:var(--t-s);color:var(--muted);background:var(--surface-2);padding:6px 14px;border-radius:999px;text-align:center;max-width:92%}
.notice.err{background:var(--warn-soft);color:var(--fg)}
.day-sep{align-self:center;font-size:var(--t-xs);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:6px}
.typing{display:inline-flex;gap:5px;padding:4px 0}
.typing span{width:8px;height:8px;border-radius:50%;background:var(--muted);animation:bob 1.2s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes bob{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}

.safety{align-self:stretch;border:2px solid var(--crit);background:var(--crit-soft);border-radius:var(--r-lg);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.safety h3{font-size:var(--t-m);font-family:var(--f-body);font-weight:700}
.safety .lines{display:grid;gap:8px}
.safety .line{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--surface);border-radius:var(--r);padding:8px 12px}
.safety .num{font-size:var(--t-l);font-weight:700;font-variant-numeric:tabular-nums;user-select:all}

.composer{display:flex;flex-direction:column;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding-bottom:2px}
.chips[hidden]{display:none}
.chip{flex:1 1 calc(50% - 4px);text-align:center;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 12px;cursor:pointer;font-size:var(--t-s);font-weight:700;min-height:46px}
.filters .chip{flex:none}
.chip:hover{border-color:var(--accent)}
.inputrow{display:flex;gap:8px;align-items:flex-end}
.inputrow textarea{flex:1;min-width:0;resize:none;border:2px solid var(--line);border-radius:var(--r-lg);padding:12px 16px;background:var(--surface);max-height:140px;min-height:52px;line-height:1.4}
.inputrow textarea:focus{border-color:var(--accent);outline:none}
.iconbtn{width:52px;height:52px;flex:none;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;background:var(--surface-2);color:var(--fg)}
.iconbtn svg{width:24px;height:24px}
.iconbtn.primary{background:var(--accent);color:var(--accent-fg)}
.iconbtn:disabled{opacity:.45;cursor:default}
.hint{font-size:var(--t-xs);color:var(--muted);padding:0 8px}

.startcard{align-self:center;margin:auto;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;max-width:420px;padding:12px}
.startcard h2{font-size:var(--t-xl);font-style:italic}
.startcard p{color:var(--muted)}
.startcard .fineprint{font-size:var(--t-xs);max-width:40ch}

/* Buttons */
.btn{border:0;border-radius:999px;padding:12px 20px;min-height:48px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--accent-fg);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.big{font-size:var(--t-m);padding:16px 28px}
.btn.ghost{background:var(--surface);color:var(--accent);border:1.5px solid var(--accent)}
.btn.small{min-height:38px;padding:7px 14px;font-size:var(--t-s)}
.btn.danger{background:var(--crit);color:var(--surface)}
.btn:disabled{opacity:.5;cursor:default}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:700;cursor:pointer;padding:6px;text-decoration:underline;text-underline-offset:3px}

/* Panels */
.panel-head{display:flex;flex-direction:column;gap:6px;padding:8px 0 16px;max-width:720px}
.panel-head h2{font-size:var(--t-xl)}
.panel-head p{color:var(--muted)}
.section{max-width:720px;display:flex;flex-direction:column;gap:12px;margin-bottom:28px}
.section > h3{font-size:var(--t-l)}
.eyebrow{font-size:var(--t-xs);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:700}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);min-height:58px}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0}
.row .main b{display:block}
.row .sub{color:var(--muted);font-size:var(--t-s)}
.time{font-variant-numeric:tabular-nums;font-weight:700;font-size:var(--t-l);width:4.2ch;flex:none}
.pill{font-size:var(--t-xs);padding:3px 10px;border-radius:999px;white-space:nowrap;font-weight:700}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.neutral{background:var(--surface-2);color:var(--muted)}
.x{background:none;border:0;color:var(--muted);cursor:pointer;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}
.x:hover{background:var(--surface-2);color:var(--crit)}
.x svg{width:20px;height:20px}
.empty{padding:18px;color:var(--muted);text-align:center}

form.card,.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-weight:700;font-size:var(--t-s)}
.field .help{color:var(--muted);font-size:var(--t-xs)}
.field input,.field select,.field textarea{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg);min-height:46px;width:100%}
.field textarea{min-height:76px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:var(--t-s)}
.check input{width:22px;height:22px;flex:none;margin-top:2px;accent-color:var(--accent)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px}
.toggle input{width:22px;height:22px;accent-color:var(--accent)}
.rowbtns{display:flex;gap:10px;flex-wrap:wrap}

/* Family */
.fam-banner{background:var(--info-soft);border-radius:var(--r);padding:12px 14px;font-size:var(--t-s);max-width:720px;margin-bottom:20px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.day.today{border-color:var(--accent);border-width:2px}
.day .dname{font-size:var(--t-xs);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.day .dnum{font-weight:700;font-variant-numeric:tabular-nums}
.dot{width:16px;height:16px;border-radius:50%;background:var(--surface-2);border:2px solid var(--line)}
.dot.good{background:var(--good);border-color:var(--good)}
.dot.neutral{background:var(--muted);border-color:var(--muted)}
.dot.warn{background:var(--warn);border-color:var(--warn)}
.day .meds{font-size:var(--t-xs);font-variant-numeric:tabular-nums;color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:var(--t-xs);color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .dot{width:12px;height:12px}
.alert{display:flex;gap:12px;padding:12px 14px;border-top:1px solid var(--line);align-items:flex-start}
.alert:first-child{border-top:0}
.alert .bar{width:5px;align-self:stretch;border-radius:4px;flex:none}
.alert.crit .bar{background:var(--crit)}.alert.warn .bar{background:var(--warn)}.alert.info .bar{background:var(--info)}
.alert.seen{opacity:.6}
.summary{font-family:var(--f-display);font-size:var(--t-m);line-height:1.6;white-space:pre-wrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat b{display:block;font-size:var(--t-xl);font-variant-numeric:tabular-nums;font-family:var(--f-display)}
.stat span{color:var(--muted);font-size:var(--t-s)}
.ex{font-size:var(--t-xs);background:var(--sun-soft);color:var(--fg);padding:1px 8px;border-radius:999px}

.top-right{display:flex;align-items:center;gap:12px}
.helpbtn{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--accent);color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:6px 14px;font-weight:700;cursor:pointer;min-height:44px}
.helpbtn svg{width:20px;height:20px}
@media (max-width:480px){.clock{display:none}}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet{background:var(--bg);border-radius:var(--r-lg);max-width:520px;width:100%;max-height:100%;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.sheet h2{font-size:var(--t-xl)}
.sheet .safety{border:0;padding:0;background:none}
@media (min-width:900px){.sheet-bg{align-items:center}}
.book{display:grid;gap:16px;max-width:720px}
.page{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;display:flex;flex-direction:column;gap:10px}
.page .kind{font-size:var(--t-xs);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:700}
.page h3{font-size:var(--t-xl);font-style:italic}
.page .by{color:var(--muted);font-size:var(--t-s)}
.page h4{font-size:var(--t-xs);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:6px 0 0}
.page ul,.page ol{margin:0;padding-left:1.4em;font-family:var(--f-display);font-size:var(--t-m);display:grid;gap:4px}
.page .secret{background:var(--sun-soft);border-radius:12px;padding:10px 14px;font-family:var(--f-display);font-style:italic}
.page .story{font-family:var(--f-display);font-size:var(--t-m);line-height:1.65;white-space:pre-wrap}
.page .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;padding-top:4px}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:var(--t-s);z-index:30;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px)}
.toast button{background:none;border:0;color:var(--sun);font-weight:700;cursor:pointer}

/* ===== Call: the companion fills the screen ===== */
.call{position:fixed;inset:0;overflow:hidden;background:#0c0a12;color:#fff;padding:0!important;display:block;height:auto}
.call-bg{position:absolute;inset:-60px;width:calc(100% + 120px);height:calc(100% + 120px);max-width:none;object-fit:cover;filter:blur(42px) saturate(1.25) brightness(.5);pointer-events:none}
.call-photo{position:absolute;inset:0;display:flex;justify-content:center;pointer-events:none}
.call-photo img{width:100%;height:100%;max-width:none;object-fit:cover;object-position:48% 30%;transform-origin:49% 34%;animation:breathe2 7s ease-in-out infinite}
@media (min-aspect-ratio: 4/5){
  .call-photo img,.call-photo video{object-position:50% 30%}
  .scrim{height:52%}
}
.call.talking .call-photo img{animation:talk2 2.6s ease-in-out infinite}
.call-photo video{position:absolute;inset:0;width:100%;height:100%;max-width:none;object-fit:cover;object-position:48% 30%;opacity:0;transition:opacity .16s linear}
.call-photo video.on{opacity:1}
.call.has-video .call-photo img{animation:none}
.call-fallback{margin:auto;width:min(70vw,48vh);height:min(70vw,48vh)}
.halo{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 90px rgba(255,138,120,.24),inset 0 0 180px rgba(255,190,160,.16);transition:opacity .6s;opacity:.7}

<script>
"use strict";
/* ============ Configuração do teste ============
   proxy: endereço do Worker na Cloudflare (ver README). Sem ele a página abre, mas a Cora não responde.
   O código de acesso chega pela URL (?codigo=XXXX) na primeira abertura e fica guardado no aparelho. */
const CONFIG = { proxy: "https://cora-proxy.johnatanmf.workers.dev" };
/* ============ Utilities ============ */
const $ = s => document.querySelector(s);
const uid8 = () => Math.random().toString(36).slice(2, 10);
const clone = o => JSON.parse(JSON.stringify(o));
const pad = n => String(n).padStart(2, "0");
const ymd = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const hhmm = d => pad(d.getHours()) + ":" + pad(d.getMinutes());
const todayKey = () => ymd(new Date());
const mins = t => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
const nowMins = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
const daysAgo = n => { const d = new Date(); d.setDate(d.getDate() - n); return ymd(d); };
const parseYmd = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const periodo = (h = new Date().getHours()) => h < 5 ? "madrugada" : h < 12 ? "manhã" : h < 18 ? "tarde" : "noite";
const pick = a => a[Math.floor(Math.random() * a.length)];
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "html") el.innerHTML = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : String(c));
  return el;
}
const ICON_X = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>';
/* replaceChildren(null) escreveria "null" na tela; aqui os vazios são ignorados. */
const put = (el, ...kids) => el.replaceChildren(...kids.flat().filter(c => c != null && c !== false));

}

/* ============ State & storage ============ */
const LS_STATE = "companheira_state_v1", LS_CHAT = "companheira_chat_v1";
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const lsDel = k => { try { localStorage.removeItem(k); } catch {} };
const DEFAULT_SETTINGS = { tts: true, voice: "", rate: 0.95, tier: "default", silence: 20, voiceOk2: false };
let S = lsGet(LS_STATE);
let CHAT = lsGet(LS_CHAT) || { msgs: [] };
let db = null, viewerId = null, storeMode = "navegador", sample = null, sampleState = "loading";

function blankState() {
  return { v: 1, profile: null, memories: [], people: [], notebook: [], reminders: [], log: {}, alerts: [], weekly: null, settings: { ...DEFAULT_SETTINGS } };
}
function ensure() {
  if (!S) S = blankState();
  S.settings = { ...DEFAULT_SETTINGS, ...(S.settings || {}) };
  for (const k of ["memories", "people", "notebook", "reminders", "alerts"]) if (!Array.isArray(S[k])) S[k] = [];
  if (!S.log) S.log = {};
}
ensure();
function day(k = todayKey()) {
  const d = S.log[k] || (S.log[k] = {});
  d.moods ||= []; d.meds ||= {}; d.fired ||= {}; d.connections ||= [];
  d.convs ||= 0; d.checkins ||= 0;
  return d;
}

const pending = new Set(); let saveTimer = null, saving = false;
function save(which = "state") {
  if (which === "chat") { if (CHAT.msgs.length > 140) CHAT.msgs = CHAT.msgs.slice(-140); lsSet(LS_CHAT, CHAT); }
  else { pruneLog(); lsSet(LS_STATE, S); }
  if (!db) return;
  pending.add(which); clearTimeout(saveTimer); saveTimer = setTimeout(flush, 800);
}
async function flush() {
  if (saving) { saveTimer = setTimeout(flush, 600); return; }
  saving = true;
  try {
    for (const w of [...pending]) {
      pending.delete(w);
      await db.doc("data/users/" + viewerId + "/" + w).set(clone(w === "chat" ? CHAT : S));
    }
  } catch (e) {
    if (["invalid_argument", "not_granted", "revoked", "capability_disabled", "capability_removed"].includes(e && e.code)) {
      db = null; storeMode = "navegador"; if (currentView === "ajustes") renderAjustes();
    } else if (e && e.code === "quota_exceeded") toast("Espaço de memória cheio. Apague conversas antigas em Perfil.");
  }
  saving = false;
}
function pruneLog() {
  const keys = Object.keys(S.log).sort();
  while (keys.length > 60) delete S.log[keys.shift()];
  if (S.memories.length > 160) S.memories = S.memories.slice(-160);
  if (S.alerts.length > 60) S.alerts = S.alerts.slice(-60);
}

};

/* ============ Face ============ */

<defs><clipPath id="fc"><circle cx="100" cy="100" r="98"/></clipPath></defs>

function historyTurns() {
  const out = [];
  for (const m of CHAT.msgs.slice(-36)) {
    if (m.r === "u") out.push({ role: "user", content: m.t });
    else if (m.r === "a" && m.t) out.push({ role: "assistant", content: m.t });

function splitReply(raw) {
  const i = raw.indexOf("<<<");
  const fala = (i >= 0 ? raw.slice(0, i) : raw).trim();
  let data = null;
  if (i >= 0) {
    let j = raw.slice(i).replace(/^<<<\s*DADOS\s*>>>/i, "").trim().replace(/^```(?:json)?/i, "").replace(/```\s*$/, "").trim();
    const a = j.indexOf("{"), b = j.lastIndexOf("}");
    if (a >= 0 && b > a) { try { data = JSON.parse(j.slice(a, b + 1)); } catch {} }
  }
  return { fala, data };
}

let busy = false, ctl = null;
async function generate(extraUserTurn) {
  if (!sample) { addNotice(sampleMessage(), "err"); return; }
  busy = true; setBusyUI(true); setStatus("thinking");
  const turns = [{ role: "user", content: rules() }, ...historyTurns()];
  if (extraUserTurn) turns.push({ role: "user", content: extraUserTurn });
  if (turns[turns.length - 1].role !== "user") turns.push({ role: "user", content: "(mensagem do sistema: continue a conversa)" });
  const live = { id: uid8(), r: "a", t: "", ts: Date.now(), live: true };
  /* With voice on, each finished sentence goes to the voice while Claude is still writing the rest
     (and the hidden data block after it), instead of waiting for the whole reply. */
  const vl = voiceOn() ? voiceLine({ msg: live }) : null;
  let fed = 0;
  const feed = (fala, final) => {
    let rest = fala.slice(fed), m;
    while ((m = /^[\s\S]*?[.!?…]+["”)]*\s+/.exec(rest))) { vl.push(m[0]); fed += m[0].length; rest = rest.slice(m[0].length); }
    if (final && rest.trim()) { vl.push(rest); fed = fala.length; }
  };
  CHAT.msgs.push(live); renderLog();
  ctl = new AbortController();
  try {
    const res = await sample(turns, {
      cache: false, signal: ctl.signal, modelTier: S.settings.tier,
      onText: ({ text }) => { const f = splitReply(text).fala; if (vl) feed(f, false); else { live.t = f; updateLive(live); } }
    });
    const { fala, data } = splitReply(res.text || "");
    live.t = fala || "Hum... me perdi aqui. Pode repetir?"; delete live.live;
    if (data) applyData(data, live);
    save("chat"); save("state"); renderLog();
    if (vl) { feed(live.t, true); vl.close(); } else talkFor(live.t);
  } catch (e) {
    const kept = e && e.text ? splitReply(e.text).fala : "";
    if (vl) { if (e && e.code === "cancelled") stopVoice(); else vl.close(); }
    if (kept) { live.t = kept; delete live.live; save("chat"); }
    else CHAT.msgs = CHAT.msgs.filter(m => m !== live);
    if (!(e && e.code === "cancelled")) addNotice(errorCopy(e && e.code), "err", true);
    renderLog();
  } finally {
    busy = false; ctl = null; setBusyUI(false); if (!talkTimer) setStatus("idle");
  }
}

function accessCode() {

    if (c) { localStorage.setItem("cora_codigo", c.trim()); u.searchParams.delete("codigo"); history.replaceState(null, "", u.pathname + (u.search || "") + u.hash); }
    return localStorage.getItem("cora_codigo") || "";
  } catch { return ""; }
}
function makeProxySample() {

    let res;
    try {
      res = await fetch(CONFIG.proxy, { method: "POST", signal: opts.signal, headers: { "Content-Type": "application/json", "X-Access-Code": accessCode() },
        body: JSON.stringify({ messages, tier: opts.modelTier || "default" }) });
    } catch (e) { throw { code: e && e.name === "AbortError" ? "cancelled" : "network", text: "" }; }
    if (!res.ok) {
      const code = res.status === 401 ? "not_granted" : res.status === 429 ? "rate_limited" : res.status === 413 ? "prompt_too_large" : "server";
      throw { code, message: await res.text().catch(() => "") };
    }
    const reader = res.body.getReader(), dec = new TextDecoder(); let buf = "", text = "";
    try {
      for (;;) {
        const { value, done } = await reader.read(); if (done) break;
        buf += dec.decode(value, { stream: true }); let i;
        while ((i = buf.indexOf("\n\n")) >= 0) {
          const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
          for (const line of chunk.split("\n")) {
            if (!line.startsWith("data:")) continue;
            let ev; try { ev = JSON.parse(line.slice(5).trim()); } catch { continue; }
            if (ev.type === "content_block_delta" && ev.delta && ev.delta.type === "text_delta") { text += ev.delta.text; opts.onText && opts.onText({ text, delta: ev.delta.text }); }
            else if (ev.type === "error") throw { code: "server", message: ev.error && ev.error.message, text };
          }
        }
      }
    } catch (e) { if (e && e.name === "AbortError") throw { code: "cancelled", text }; throw e; }
    if (buf.trim()) for (const line of buf.split("\n")) { if (!line.startsWith("data:")) continue; let ev; try { ev = JSON.parse(line.slice(5).trim()); } catch { continue; } if (ev.type === "content_block_delta" && ev.delta && ev.delta.type === "text_delta") text += ev.delta.text; }
    return { text, truncated: false };
  };
  fn.json = async (i, o) => JSON.parse((await fn(i, o)).text);
  fn.limits = async () => ({ images: false });
  return fn;
}
